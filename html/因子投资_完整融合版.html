gfXPebA=';const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));async function openPage(password){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(iv)},key,b64(data));sessionStorage.setItem('private_site_password',password);document.open();document.write(new TextDecoder().decode(plain));document.close()}const form=document.getElementById('form'),input=document.getElementById('password'),button=document.getElementById('button'),error=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';button.disabled=true;button.textContent='正在验证…';try{await openPage(input.value)}catch{error.textContent='密码不正确，请重新输入。';input.select();button.disabled=false;button.textContent='打开网页'}});const saved=sessionStorage.getItem('private_site_password');if(saved){openPage(saved).catch(()=>sessionStorage.removeItem('private_site_password'))}</script></body></html>
